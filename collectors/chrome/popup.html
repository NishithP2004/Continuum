<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continuum</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span class="mark">C</span><div><h1>Continuum</h1><p id="connection">Checking local engine…</p></div></header>
      <section class="project" aria-live="polite">
        <span class="label">Active project</span>
        <strong id="project">Not detected</strong>
        <span id="project-help">Open a project in VS Code or a Continuum-enabled terminal.</span>
      </section>
      <p class="privacy">Only an allowlisted foreground host and sanitized path can be captured. Page content, titles, queries, and cookies stay out.</p>
      <label class="toggle"><input id="enabled" type="checkbox" />Capture active allowed tabs</label>
      <button id="pair" type="button">Pair with Continuum</button>
      <button id="capture" class="secondary" type="button">Capture current tab</button>
      <output id="status" aria-live="polite"></output>
    </main>
    <script src="popup.mjs" type="module"></script>
  </body>
</html>
